name: CI

# Runs on every push and every pull request, against ANY branch — not
# just main — so a broken PR is caught before it merges, not after.
on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        # TESTING=1 here too (not just in conftest.py) so it's also set
        # before conftest.py itself runs its own `import main` at
        # collection time — belt-and-braces with the same guard inside
        # conftest.py, in case pytest's own startup ever runs anything
        # module-level ahead of it. JWT_SECRET_KEY is a throwaway value
        # that only needs to exist for this ephemeral CI run.
        env:
          TESTING: "1"
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-only-throwaway-secret-not-for-real-use
        run: pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        # Confirms the whole React app compiles cleanly (esbuild via
        # Vite) — the same check this project has been manually
        # verified against ("esbuild-clean") after every feature batch,
        # now enforced automatically instead of by hand.
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    # Only on pushes, not every PR — this job is slower (two full image
    # builds) and its main value is catching a broken Dockerfile before
    # it reaches main, not blocking every in-progress PR.
    if: github.event_name == 'push'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t delivery-sync-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t delivery-sync-frontend:ci ./frontend --build-arg VITE_API_BASE_URL=http://localhost:8000
