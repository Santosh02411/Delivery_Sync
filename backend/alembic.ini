# Alembic configuration. The database URL is NOT set here: alembic/env.py takes it from the application's
# own setting (DATABASE_URL, default sqlite:///./database.db — see app/db/session.py), so migrations always
# run against the same database the app uses.

[alembic]
script_location = alembic
# 0001_baseline.py, 0002_sync_events.py ... : readable, sortable, one revision per file
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = utc

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
